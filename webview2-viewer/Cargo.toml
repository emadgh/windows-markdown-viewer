[package]
name = "markdown-viewer-webview2"
version = "0.2.0"
edition = "2021"
build = "build.rs"

[dependencies]
open = "5"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.35.3"
wry = { version = "0.55.1", features = ["protocol"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
